[project]
name = "semqueue"
version = "0.1.0"
description = "Backpressure queue via Semaphore composition"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "Vitaliy Muminov", email = "vitaliy.muminov+github@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []
keywords = ["queue", "semaphore", "threading", "concurrency", "backpressure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/vmuminov/semqueue"
Repository = "https://github.com/vmuminov/semqueue"
Issues = "https://github.com/vmuminov/semqueue/issues"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "N", "C4", "SIM", "RET", "PTH", "FURB", "ISC", "T20"]
extend-safe-fixes = ["B", "C4", "PT", "UP", "ISC"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov-fail-under=80 --cov-report=term-missing"
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
strict = ["src/**/*.py"]
exclude = ["src/**/__init__.py", "**/__pycache__", "**/.*", ".venv"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.22",
]
